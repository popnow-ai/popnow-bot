name: Docker image

# Builds the bot image and pushes it to Docker Hub as popnow/popnow-bot.
# Runs on version tags (v1.2.3) and by hand; the tag build also updates :latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Version from package.json
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            popnow/popnow-bot:${{ steps.v.outputs.version }}
            popnow/popnow-bot:latest
          labels: |
            org.opencontainers.image.title=popnow-bot
            org.opencontainers.image.description=Self-hosted Telegram and Discord bot for AI image and video generation with PopNow
            org.opencontainers.image.url=https://popnow.ai
            org.opencontainers.image.source=https://github.com/popnow-ai/popnow-bot
            org.opencontainers.image.licenses=MIT
